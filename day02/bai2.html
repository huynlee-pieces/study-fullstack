<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài tập 1 - Day 2</title>
  <link rel="stylesheet" href="./asset/style.css">
  <style>
    .container {
      display: block;
      max-width: 1220px;
      margin: 0 auto;
    }

    .form-register {
      margin-block: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    #form-dang-ky {
      width: 400px;
      border: 1px solid gray;
      padding: 20px;
      background: whitesmoke;
    }

    h2 {
      text-align: center;
      color: blue;
    }

    label {
      font-size: 1.6rem;
    }

    input {
      padding: 5px;
    }

    .nut-dang-ky {
      padding: 10px;
      background-color: blue;
      color: white;
      font-size: 1.6rem;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <section class="form-register container">
    <h2>Đăng ký khóa học</h2>
    <form id="form-dang-ky">
      <p>
        <label for="ho-va-ten">Họ và tên:</label>
        <input type="text" name="ho-va-ten" id="ho-va-ten" placeholder="Nhập họ và tên" required>
      </p>
      <p>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="Nhập email" required>
      </p>
      <p>
        <label for="mat-khau">Nhập mật khẩu:</label>
        <input type="password" name="mat-khau" id="mat-khau" placeholder="Nhập mật khẩu" required>
      </p>
      <p>
        <label for="gioi-tinh">Giới tính:</label>
        <input type="radio" name="gioi-tinh" value="nam" required> Nam
        <input type="radio" name="gioi-tinh" value="nu" required> Nữ
      </p>
      <p>
        <label for="khoa-hoc">Khóa học:</label>
        <select name="khoa-hoc" id="khoa-hoc" required>
          <option value="html-css">HTML/CSS</option>
          <option value="javascript">JavaScript</option>
          <option value="react">React</option>
        </select>
      </p>
      <p>
        <label for="ghi-chu">Ghi chú:</label>
        <textarea name="ghi-chu" id="ghi-chu" placeholder="Nhập ghi chú"></textarea>
      </p>
      <button type="submit" class="nut-dang-ky">Đăng ký</button>
    </form>
  </section>
</body>
</html>
